<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; media-src https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: system-ui, 'Segoe UI', sans-serif; }

  /* ----- blague au centre ----- */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    max-width: 70vw; max-height: 80vh;
    opacity: 0; transform: scale(.6);
    transition: opacity .25s ease, transform .25s cubic-bezier(.2,1.4,.4,1);
  }
  .card.in { opacity: 1; transform: scale(1); }
  .card img, .card video { max-width: 70vw; max-height: 60vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .caption {
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: clamp(28px, 4.5vw, 64px);
    text-transform: uppercase; text-align: center; color: #fff;
    -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 0 4px 12px rgba(0,0,0,.6);
    word-break: break-word;
  }

  /* ----- qui a envoyé (haut gauche) ----- */
  #from {
    position: fixed; top: 24px; left: 24px;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 20px 8px 8px; border-radius: 999px;
    background: rgba(20,20,24,.85); color: #fff; font-weight: 700; font-size: 20px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
    opacity: 0; transform: translateX(-40px);
    transition: opacity .25s ease, transform .3s cubic-bezier(.2,1.2,.4,1);
    pointer-events: none;
  }
  #from.in { opacity: 1; transform: none; }

  /* ----- avatars (communs) ----- */
  .av { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; }
  .av.ini { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 24px; text-transform: uppercase; }

  /* ----- connectés (haut droite) ----- */
  #presence { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: row-reverse; gap: 10px; pointer-events: none; }
  .user { display: flex; flex-direction: column; align-items: center; gap: 3px; opacity: .92; }
  .user .wrap { position: relative; }
  .user .av { width: 44px; height: 44px; font-size: 18px; border: 2px solid rgba(255,255,255,.9); box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  .user .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: #3ddc84; border: 2px solid #1b1b1f; }
  .user .nm { font-size: 11px; font-weight: 600; color: #fff; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 4px #000, 0 0 2px #000; }
</style>
</head>
<body>
<div id="presence"></div>
<div id="from"></div>
<div id="stage"></div>
<script src="overlay.js"></script>
</body>
</html>
