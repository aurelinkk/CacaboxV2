[package]
name = "livekgb"
version = "0.6.1"
description = "Overlay de blagues entre potes"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Binaire le plus petit possible
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
