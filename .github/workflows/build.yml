name: Build installeurs

on:
  push:
    tags: ['v*', '[0-9]*']   # se déclenche sur un tag, ex: v0.5.0
  workflow_dispatch:         # ou à la main depuis l'onglet Actions (build de test, sans release)

jobs:
  # Sur un tag : crée la release une seule fois, avant que les 3 builds y déposent leurs fichiers
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: rel
        uses: softprops/action-gh-release@v2
        with:
          name: LiveKgb ${{ github.ref_name }}
          body_path: CHANGELOG.md   # le changelog complet, depuis la première version

  build:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin   # Mac M1/M2/M3/M4
          - os: macos-latest
            target: x86_64-apple-darwin    # Mac Intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      # Construit l'appli, signe la mise à jour, et (sur un tag) publie la release
      # avec latest.json : c'est ce fichier que le bouton « Rechercher une mise à jour » lit.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.release.outputs.id }}

      - name: Vérifier la signature Mac
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/lk "$dmg"
          codesign --verify --deep --strict --verbose=2 /tmp/lk/LiveKgb.app
          hdiutil detach /tmp/lk

      - name: Rassembler les installeurs
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe out/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installeur-${{ matrix.target }}
          path: out/*

