name: Build installeurs

on:
  push:
    tags: ['v*', '[0-9]*']   # se déclenche sur un tag, ex: v0.2.0 ou 1.0
  workflow_dispatch:   # ou à la main depuis l'onglet Actions

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install   # pas de package-lock.json, donc pas de npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # pas de certificat de signature
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
