name: Build installeurs

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:   # ou à la main depuis l'onglet Actions

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Vérifier la signature Mac
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"; codesign --verify --deep --strict --verbose=2 "$app"
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
